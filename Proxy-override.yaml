# ================================================================
#  远程规则集（SukkA via Paxxs/clash-skk YAML 版）
# ================================================================
#  规则来源：SukkaW/Surge（https://ruleset.skk.moe）
#  格式转换：Paxxs/clash-skk（https://github.com/Paxxs/clash-skk）
#  CDN 分发：cdn.jsdelivr.net
#
#  规则分为三层，严格保持以下顺序：
#    1. domainset（behavior: domain）— 纯域名列表，不触发 DNS
#    2. non_ip（behavior: classical）— 非 IP 规则，不触发 DNS
#    3. ip（behavior: classical | ipcidr）— IP 规则，触发 DNS
#
#  所有 rule-provider 的 proxy 统一为 DIRECT，避免策略组选 DIRECT
#  时规则集因无代理可用而下载失败。

rule-providers:
  # ========== 一层：domainset（纯域名匹配） ==========

  # 广告拦截（domainset）— SukkA 广告、跟踪、恶意软件域名
  reject:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/domainset/reject.yaml
    path: ./ruleset/sukka-reject.yaml
    interval: 43200
    proxy: DIRECT

  # 广告拦截补充 — 额外 90K+ 广告域名
  reject_extra:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/domainset/reject_extra.yaml
    path: ./ruleset/sukka-reject-extra.yaml
    interval: 43200
    proxy: DIRECT

  # ========== 二层：non_ip（经典规则，不触发 DNS） ==========

  # AI 服务
  ai:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/ai.yaml
    path: ./ruleset/sukka-ai.yaml
    interval: 43200
    proxy: DIRECT

  # Telegram
  telegram:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/telegram.yaml
    path: ./ruleset/sukka-telegram.yaml
    interval: 43200
    proxy: DIRECT

  # 苹果 CDN（ICP 备案，国内直连）
  apple_cdn:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/apple_cdn.yaml
    path: ./ruleset/sukka-apple-cdn.yaml
    interval: 43200
    proxy: DIRECT

  # 苹果服务（非 CDN，需代理）
  apple_services:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/apple_services.yaml
    path: ./ruleset/sukka-apple-services.yaml
    interval: 43200
    proxy: DIRECT

  # 苹果中国服务（iCloud CN、Apple Maps CN）
  apple_cn:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/apple_cn.yaml
    path: ./ruleset/sukka-apple-cn.yaml
    interval: 43200
    proxy: DIRECT

  # 微软 CDN（ICP 备案，国内直连）
  microsoft_cdn:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/microsoft_cdn.yaml
    path: ./ruleset/sukka-microsoft-cdn.yaml
    interval: 43200
    proxy: DIRECT

  # 微软服务（非 CDN）
  microsoft:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/microsoft.yaml
    path: ./ruleset/sukka-microsoft.yaml
    interval: 43200
    proxy: DIRECT

  # 国内常用站点
  domestic:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/domestic.yaml
    path: ./ruleset/sukka-domestic.yaml
    interval: 43200
    proxy: DIRECT

  # 直连域名（国内静态资源、CDN 等）
  direct:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/direct.yaml
    path: ./ruleset/sukka-direct.yaml
    interval: 43200
    proxy: DIRECT

  # 国外常用站点（需代理）
  global:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/global.yaml
    path: ./ruleset/sukka-global.yaml
    interval: 43200
    proxy: DIRECT

  # 扩展国外站点（global 的补充）
  global_plus:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/global_plus.yaml
    path: ./ruleset/sukka-global-plus.yaml
    interval: 43200
    proxy: DIRECT

  # 局域网域名
  lan:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/non_ip/lan.yaml
    path: ./ruleset/sukka-lan.yaml
    interval: 43200
    proxy: DIRECT

  # ========== 三层：ip（IP 规则，触发 DNS） ==========

  # 中国 IP（替代 GEOIP,CN）
  china_ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Paxxs/clash-skk@main/Clash/ip/china_ip.yaml
    path: ./ruleset/sukka-china-ip.yaml
    interval: 43200
    proxy: DIRECT

  # ========== 保留的外部规则集（SukkA 未覆盖） ==========

  # GitHub（SukkA 无独立归类，保留 MetaCubeX MRS）
  github:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs
    path: ./ruleset/meta-github.mrs
    interval: 43200
    proxy: DIRECT

# ================================================================
#  分流规则
# ================================================================
#  规则顺序严格遵守：domainset → non_ip → ip
#  即：所有不触发 DNS 的规则优先匹配，最后匹配触发 DNS 的规则

rules:
  # --- 微信小程序基础设施（reject 规则集可能误伤，优先放行）---
  - DOMAIN-SUFFIX,wxs.qq.com,DIRECT
  - DOMAIN-SUFFIX,wx.qlogo.cn,DIRECT
  - DOMAIN-SUFFIX,servicewechat.com,DIRECT
  - DOMAIN-SUFFIX,mp.weixin.qq.com,DIRECT
  - DOMAIN,school-wx.qshnhealth.com,DIRECT

  # --- 推送 / 归因 / CDN（reject 规则集误伤，优先放行）---
  # 火山引擎 APM
  - DOMAIN,apmplus.volces.com,DIRECT
  # 极光推送（米哈游等国服游戏基础设施）
  - DOMAIN-SUFFIX,jpush.io,DIRECT
  - DOMAIN-SUFFIX,jpush.cn,DIRECT
  - DOMAIN,easytomessage.com,DIRECT
  # 友盟推送/错误日志
  - DOMAIN,msg.umeng.com,DIRECT
  - DOMAIN,msg.umengcloud.com,DIRECT
  - DOMAIN,errlog.umeng.com,DIRECT
  # 归因 SDK（Adjust/AppsFlyer）
  - DOMAIN,app.adjust.com,DIRECT
  - DOMAIN,app.appsflyer.com,DIRECT
  # 公共 CDN
  - DOMAIN-SUFFIX,baomitu.com,DIRECT
  - DOMAIN-SUFFIX,bootcss.com,DIRECT
  - DOMAIN-SUFFIX,staticfile.org,DIRECT
  - DOMAIN-SUFFIX,upaiyun.com,DIRECT
  # Android 系统服务（被墙，走代理）
  - DOMAIN-SUFFIX,mtalk.google.com,Google
  - DOMAIN,clientservices.googleapis.com,Google
  - DOMAIN,update.googleapis.com,Google
  - DOMAIN-SUFFIX,dl.google.com,Google
  - DOMAIN-SUFFIX,dl.l.google.com,Google

  # --- 广告拦截（domainset 规则，不触发 DNS）---
  - GEOSITE,category-ads-all,广告拦截
  - RULE-SET,reject,广告拦截
  - RULE-SET,reject_extra,广告拦截

  # --- QUIC 阻断 ---
  # 豁免白名单站点
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,microsoft)),微软
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,apple_services)),苹果
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,apple_cdn)),苹果
  - AND,((DST-PORT,443),(NETWORK,UDP),(GEOSITE,youtube)),YouTube
  - AND,((DST-PORT,443),(NETWORK,UDP),(GEOSITE,google)),Google
  # 其余非中国 UDP 443 一律 REJECT（阻断 QUIC）
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,domestic)),国内直连
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((RULE-SET,china_ip)))),REJECT

  # --- 局域网 / 私有网络 ---
  - DST-PORT,7680,REJECT
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - RULE-SET,lan,DIRECT

  # --- 进程名直连（仅 Windows 平台 TUN 模式生效）---
  - PROCESS-NAME,WinStore.App.exe,DIRECT
  - PROCESS-NAME,WinStore.Mobile.exe,DIRECT
  - PROCESS-NAME,Weixin.exe,DIRECT
  - PROCESS-NAME,WeChat.exe,DIRECT
  - PROCESS-NAME,WeChatAppEx.exe,DIRECT
  - PROCESS-NAME,QQ.exe,DIRECT
  - PROCESS-NAME,SunloginClient.exe,DIRECT
  - PROCESS-NAME,ToDesk.exe,DIRECT
  - PROCESS-NAME,ToDesk_Service.exe,DIRECT
  - PROCESS-NAME,rustdesk.exe,DIRECT
  - PROCESS-NAME,TeamViewer.exe,DIRECT
  - PROCESS-NAME,AnyDesk.exe,DIRECT
  - PROCESS-NAME,tailscale.exe,DIRECT
  - PROCESS-NAME,tailscaled.exe,DIRECT
  - PROCESS-NAME,frpc.exe,DIRECT
  - PROCESS-NAME,Navicat.exe,DIRECT
  - PROCESS-NAME,cloudflared.exe,DIRECT

  # --- 前置路由（确保规则集和 DNS 下载走代理）---
  - DOMAIN-SUFFIX,jsdelivr.net,节点选择
  - DOMAIN,dns.google,节点选择
  - DOMAIN,dns.google.com,节点选择

  # --- YouTube ---
  - GEOSITE,youtube,YouTube

  # --- AI（RULE-SET 来自 SukkA ai）---
  - RULE-SET,ai,AI
  # 补充 SukkA 可能未覆盖的域名
