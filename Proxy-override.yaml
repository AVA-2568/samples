# FlClash / Mihomo 通用覆写配置
# 版本：v4.0 (2026-07-10)
# 架构：3 基础设施组 + 13 业务策略组 + 16 SukkA rule-providers + 极简 DNS
# 适用：Mihomo / Clash.Meta 内核；任何机场订阅
# 对应 JS 覆写脚本：proxy-override.js
#
# === 导入方法 ===
#
# 将本文件作为 Mihomo 配置文件加载（或与现有配置合并）。
# 必须将 proxy-providers.sub.url 替换为你的机场订阅链接。
#
# === 核心变更（v3.0 → v4.0）===
#   • DNS 简化：国内 → https://doh.pub/dns-query，国外 → https://dns.google/dns-query
#   • rule-providers 迁移至 SukkA 规则集（via Paxxs/clash-skk YAML）
#   • 所有 rule-provider 下载统一走 DIRECT（避免策略组选 DIRECT 时规则集下载死锁）
#   • 移除 tiktok 独立 rule-provider（SukkA 合并至 stream；改用 GEOSITE）
#   • 新增 china_ip / lan 等 SukkA 规则集替代部分 GEOIP/硬编码
# ================================================================

# ================================================================
#  全局参数
# ================================================================

unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-idle: 30
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

geox-url:
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geoip-mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb

# ================================================================
#  端口 / SOCKS / 混合入站
# ================================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ================================================================
#  Sniffer 嗅探
# ================================================================

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.netlify.app
    - +.vercel.app
    - +.workers.dev
  skip-domain:
    - +.mijia.cloud
    - +.oray.com
    - +.oray.net
    - +.apple.com

# ================================================================
#  DNS 极简配置
#  国内 → https://doh.pub/dns-query
#  国外 → https://dns.google/dns-query
#  default-nameserver 仅用于 bootstrap 解析 DNS 服务器自身 IP
# ================================================================

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # --- 局域网 / 本地 ---
    - +.lan
    - +.local
    - +.localhost
    - +.direct
    # --- 连通性检测 ---
    - +.msftconnecttest.com
    - +.msftncsi.com
    - captive.apple.com
    - connectivitycheck.gstatic.com
    # --- 国内常用站（fake-ip 可能影响登录/CDN 调度）---
    - +.baidu.com
    - +.bilibili.com
    - +.bing.com
    - +.chiphell.com
    - +.nvidia.com
    # --- 远程桌面 / VPN ---
    - +.oray.com
    - +.oray.net
    - +.sunlogin.com
    - +.todesk.com
    - +.rustdesk.com
    - +.teamviewer.com
    - +.anydesk.com
    - +.tailscale.com
    - +.zerotier.com
    # --- NTP 时间同步 ---
    - +.ntp.org
    - +.pool.ntp.org
    - +.time.apple.com
    - +.time.google.com
    - +.time.nist.gov
    - time.windows.com
    - ip.cip.cc
    - id6.me
    - localhost.ptlogin2.qq.com
    # --- 运营商 / 游戏 ---
    - +.cmpassport.com
    - +.mcdn.bilivideo.cn
    - +.battlenet.com.cn
    - +.wotgame.cn
    - +.wggames.cn
    - +.wowsgame.cn
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  # 国外 DNS（走代理解析）
  nameserver:
    - https://dns.google/dns-query
  # 国内域名走国内 DNS（nameserver-policy 优先于 nameserver）
  nameserver-policy:
    geosite:cn,geolocation-cn,bilibili,biliintl:
      - https://doh.pub/dns-query
  respect-rules: true

# ================================================================
#  代理订阅（proxy-provider）
# ================================================================
#  替换 sub.url 为你的机场订阅链接
#  如机场订阅本身就是 Clash 兼容格式，type 保持 http
#  如机场提供 SS/SSR/Vmess 链接，需后端转换后使用
#
#  proxy: DIRECT 说明：
#  订阅链接下载走直连，避免"首次启动节点还没下载 → 却需节
#  点去拉订阅"的鸡生蛋死循环。大部分机场订阅域名直连可访问。
#  如果你的机场订阅域名被墙，改为 proxy: 节点选择，但首
#  次启动需要先通过其他方式获取节点（如手动导入一次缓存文件）。
#
#  节点名过滤说明：
#  Mihomo 的 RE2 正则引擎不支持负向零宽断言 (?!...)，
#  无法像 JS 覆写脚本那样在 YAML 中排除"剩余/到期/官网/免费"等
#  信息节点。如果订阅含大量信息节点，建议：
#    1) 使用 proxy-override.js 覆写脚本版本（支持 isInfoNode 过滤）
#    2) 或在机场侧清理无效节点
#    3) 或手动编辑 proxy-providers/sub.yaml 缓存文件删除信息节点行

proxy-providers:
  sub:
    type: http
    url: "https://你的机场订阅链接"
    path: ./proxy-providers/sub.yaml
    # 更新时间，单位为秒，建议设置为 12 小时以上，避免过于频繁地下载订阅
    # 目前为 24 小时（86400 秒），根据需要调整
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      timeout: 5000

# ================================================================
#  策略组
# ================================================================

proxy-groups:
