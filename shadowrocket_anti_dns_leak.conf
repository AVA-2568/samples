[Rule]
# =========================================================================
# 规则匹配优先级规范 (特异性优先：防外泄 -> 测漏 -> 海外专属 -> 国内直连 -> 全球代理 -> 国内大名单 -> 局域网 -> GEOIP -> FINAL)
# =========================================================================

# ---------------------- 0. 高危敏感端口与系统服务专项加固 ----------------------
# 封堵 NetBIOS / SMB 高危外泄端口，杜绝 Windows/macOS NTLM 凭证外网泄露
DST-PORT,135,REJECT
DST-PORT,137,REJECT
DST-PORT,138,REJECT
DST-PORT,139,REJECT
DST-PORT,445,REJECT

# 苹果推送服务 (APNs) 专用端口直连保障，消除微信/系统后台推送延迟
DST-PORT,5223,DIRECT

# ---------------------- 1. 隐私安全与 DNS 测漏站点强制走代理 ----------------------
# 防止测试站点动态子域名未被常规列表收录而触发本地探测
DOMAIN-KEYWORD,browserleaks,PROXY
DOMAIN-KEYWORD,dnsleak,PROXY
DOMAIN-SUFFIX,browserleaks.com,PROXY
DOMAIN-SUFFIX,browserleaks.org,PROXY
DOMAIN-SUFFIX,dnsleaktest.com,PROXY
DOMAIN-SUFFIX,dnsleak.com,PROXY
DOMAIN-SUFFIX,ipleak.net,PROXY
DOMAIN-SUFFIX,ipleak.com,PROXY
