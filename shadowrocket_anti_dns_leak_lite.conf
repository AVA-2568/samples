[Rule]
# ==============================================================================
# 规则匹配优先级规范 (严守特异性优先：防外泄 -> 测漏 -> 海外专属 -> 国内直连 -> 全球代理 -> 国内大名单 -> 局域网 -> GEOIP -> FINAL)
