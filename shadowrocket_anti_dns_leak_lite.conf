# ----------------- 6. 中国 IP 数据库直连 -----------------
# 无论是否触发 DNS 查询，由于全局 dns-server 已设为 DNS-over-PROXY，
# 即使此处发生针对未收录域名的查询，也是由境外代理向 Google DNS 查询，绝对不会向国内 DNS 泄露！
GEOIP,CN,DIRECT

# ----------------- 7. 兜底规则 -----------------
# 凡未被明确收录为国内域名的请求，全部安全走代理通道并由远端落地服务器解析
FINAL,PROXY

[Host]
# 本地回环映射
localhost = 127.0.0.1

# 苹果系统直连服务：使用指定安全 DoH 解析，兼顾系统更新推送稳定性与防嗅探
*.apple.com = server:https://dns.alidns.com/dns-query
*.icloud.com = server:https://dns.alidns.com/dns-query

# 【终极防泄露技巧】若自建或使用固定 IP 的 xhttp tls 节点，可在此直接绑定节点 IP，彻底跳过节点 DNS 过程：
# node.example.com = 104.16.88.99
