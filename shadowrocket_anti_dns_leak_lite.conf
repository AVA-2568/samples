# ----------------- 局域网直连 (必须附加 no-resolve) -----------------
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT

# ----------------- 中国 IP 数据库直连 (核心防护：加 no-resolve) -----------------
# 极关键：若域名未命中上述任何规则，流经此处时因加了 no-resolve 不会触发本地 DNS 查询，直接跳过并滑入 FINAL 走代理！
GEOIP,CN,DIRECT,no-resolve

# ----------------- 兜底规则 -----------------
# 凡未被上述明确命中为局域网/国内域名的所有请求，全部安全回退走代理通道并由远端解析
FINAL,PROXY

[Host]
# 本地回环映射
localhost = 127.0.0.1

# 节点域名静态 IP 映射 (可选极客防护：若节点为固定 IP/CDN 优选 IP，配置此处可彻底跳过网络 DNS 解析，实现 0 泄露)
# node.example.com = 104.16.123.45

# 苹果系统直连服务：使用指定安全 DoH 解析，兼顾系统更新推送稳定性与防嗅探
*.apple.com = server:https://dns.alidns.com/dns-query
*.icloud.com = server:https://dns.alidns.com/dns-query

[URL Rewrite]
# Google 搜索防 cn 重定向
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
hostname = *.google.cn